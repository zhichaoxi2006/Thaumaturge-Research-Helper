## Gradle
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Environment
# Minecraft / NeoForge. 21.1.230 is the version this machine already has in its local
# Maven-format mirror and in the NeoForm runtime cache, so the build runs fully offline.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.230
neo_version_range=[21.1.230,)
loader_version_range=[4,)
java_version=21

# Maven-format directory holding the NeoForge artifacts, used because this machine cannot
# reach maven.neoforged.net. Empty = use the network repository only.
neoforge_local_mirror=D:/dev/ForestryCE/build/local-m2

## Required dependency: Thaumaturge (the research table this mod automates)
thaumaturge_version=1.1.0
thaumaturge_version_range=[1.1.0,)

## Mod properties
mod_id=thaumaturge_research_helper
mod_name=Thaumaturge Research Helper
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.zhichaoxi.trh
mod_description=Adds a green status LED to Thaumaturge's research table that runs the note puzzle automatically.
